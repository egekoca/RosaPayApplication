services:
  - type: web
    name: rosapay-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start --workspace @rosapay/api
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: API_AUTH_REQUIRED
        value: "true"
      # Render terminates TLS at one proxy in front of this service, so without
      # this every caller is reported as that proxy and the per-IP rate limits
      # become one shared allowance for the whole room. One hop, not the whole
      # X-Forwarded-For chain, because the chain is caller-supplied.
      - key: API_TRUST_PROXY
        value: "1"
      - key: API_REQUIRE_DATABASE
        value: "true"
      # Runs the reconciliation loop inside this service. A settlement only ever
      # reaches `confirmed` in that loop, and hosts with no free background
      # worker would otherwise charge for a second service to hold it. It opens
      # no port and only calls out, so it needs no service of its own; the
      # submit that creates work to reconcile is also the request that wakes an
      # idle instance. Set this to false and deploy apps/worker separately when
      # the traffic justifies its own process.
      - key: WORKER_IN_PROCESS
        value: "true"
      - key: WORKER_INTERVAL_MS
        value: "10000"
      - key: DATABASE_SSL
        value: "true"
      # Supabase presents `Supabase Root 2021 CA`, which is in no system trust
      # store, so a verifying client rejects the pooler until handed it. Paste
      # the PEM the Supabase dashboard offers under Database -> SSL
      # Configuration. Leave unset for a provider using a public CA.
      - key: DATABASE_CA_CERT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_SESSION_SECRET
        sync: false
      - key: STELLAR_RELAYER_SECRET
        sync: false
      - key: STELLAR_ADMIN_SECRET
        sync: false
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_SETTLEMENT_CONTRACT_ID
        sync: false
      - key: STELLAR_WALLET_WASM_HASH
        sync: false
      # Lira, and lumens through lira. The anchor quotes the asset it ramps —
      # USDC — and the Soroswap router prices the leg between lumens and that
      # asset, which is the same swap a settlement would really make. Together
      # they price a lumen balance in lira without any market feed. Drop any one
      # of these four and the deployment falls back to CoinGecko alone.
      - key: ANCHOR_QUOTE_SERVER
        value: https://tr-mock-anchor.fly.dev/sep38
      - key: ANCHOR_BRIDGE_ASSET
        value: stellar:USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      - key: ANCHOR_BRIDGE_CONTRACT_ID
        value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: SOROSWAP_ROUTER_CONTRACT_ID
        value: CCJUD55AG6W5HAI5LRVNKAE5WDP5XGZBUDS5WNTIVDU7O264UZZE7BRD
      # USDC is a fully reserved dollar stablecoin, so one of it is one dollar.
      # Saying so makes the dollar reading of a wallet the swap leg and nothing
      # else — no market feed to be throttled, and the dollar cannot go missing
      # from the currency picker. A real anchor quote still beats the peg where
      # one exists.
      - key: ANCHOR_BRIDGE_PEGGED_CURRENCIES
        value: iso4217:USD
      # A new wallet starts with this much of the anchor's asset alongside its
      # lumens, so the ordinary path — a merchant asking for USDC — works before
      # anyone has deposited. It comes out of the deployer's reserve, which is
      # filled through the ramp (`npm run testnet:try-ramp` with
      # ROSAPAY_TRY_RAMP_SECRET). When that reserve empties the transfer is
      # skipped and the wallet is still created with lumens, logged as
      # wallet_bridge_funding_skipped. Unset this to stop sending it at all.
      - key: STELLAR_WALLET_FUNDING_BRIDGE
        value: "1"
      # CoinGecko now prices only euro and naira: lira comes from the anchor and
      # the dollar from the peg above, so neither depends on it. Worth a key if
      # those two are wanted. The keyless tier is rate limited per source IP,
      # which on a shared host is spent by other tenants as much as by this
      # service, and a 429 clears the cached rate rather than serving a stale
      # one — so without a key euro and naira are absent from the currency
      # picker rather than wrong in it.
      - key: RATE_FEED_API_KEY
        sync: false
      - key: DATABASE_MAX_CONNECTIONS
        value: "3"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"

# The database is intentionally external. Render's free web plan does not
# include a durable PostgreSQL instance; use a free Supabase/Neon database and
# provide its pooled/session connection string as DATABASE_URL in the dashboard.
